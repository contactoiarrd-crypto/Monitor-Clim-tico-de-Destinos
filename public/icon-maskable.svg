<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="sunGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="waveGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="iiarrdGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable (no rx) -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Safe Zone Scaled Content (scaled to 78% centered) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Radar Rings -->
    <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="10 8" />
    <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
    <circle cx="256" cy="256" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />

    <!-- Sun Symbol -->
    <circle cx="356" cy="156" r="46" fill="url(#sunGradMask)" />
    <path d="M356 94v-16 M356 218v16 M294 156h-16 M418 156h16 M312 112l-12-12 M400 200l12 12 M312 200l-12 12 M400 112l12-12" 
          stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />

    <!-- Waves -->
    <path d="M86 350c50-32 90-32 140 0s90 32 140 0 50-20 60-15v65c-30 15-60 18-95 8s-90-26-145 0-70 12-100-3z" 
          fill="url(#waveGradMask)" />

    <!-- Shield Badge -->
    <g transform="translate(196, 170)">
      <path d="M60 0 L115 22 C115 75, 60 115, 60 115 C60 115, 5 75, 5 22 Z" 
            fill="url(#iiarrdGradMask)" stroke="#ffffff" stroke-width="4" />
      <path d="M60 30v32 M60 76v6" 
            stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Text Badge -->
    <rect x="136" y="420" width="240" height="42" rx="21" fill="#0c4a6e" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
    <text x="256" y="447" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="19" font-weight="900" fill="#f0f9ff" text-anchor="middle" letter-spacing="2">
      IIARRD • ALERTA
    </text>
  </g>
</svg>
